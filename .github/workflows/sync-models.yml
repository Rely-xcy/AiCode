name: Sync Models Metadata

on:
  schedule:
    # 每天 UTC 04:00 自动执行一次（对应北京时间 12:00）
    - cron: '0 4 * * *'
  workflow_dispatch: # 支持在 GitHub Actions 界面手动触发

permissions:
  contents: write

# 与 sync-container-images 共用同一 group：两者都写 data 分支，串行执行避免并发互相覆盖。
concurrency:
  group: sync-data-branch
  cancel-in-progress: false

jobs:
  sync-models:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch full models.dev metadata to data/models.json
        run: |
          python3 scripts/sync-models-dev.py

      - name: Publish to data branch
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # 备份新生成的文件，随后改用 orphan 单提交发布，避免机器产物污染 main。
          cp data/models.json "$RUNNER_TEMP/models.json"

          # 与 data 分支现存文件比对，无变化则跳过（避免无意义提交）。
          git fetch origin data || true
          if git show origin/data:data/models.json > "$RUNNER_TEMP/models.old.json" 2>/dev/null; then
            if cmp -s "$RUNNER_TEMP/models.old.json" data/models.json; then
              echo "模型元数据无变动，跳过提交"
              exit 0
            fi
          fi

          # data 分支由多个同步任务共同写入（models.json / container-images.json），
          # 因此必须保留其现有内容，只覆盖本次负责的文件——不能 orphan 清空重建，
          # 否则会把别的任务刚发布的文件删掉。
          # 同时仍以「单个无父提交」发布，保持 data 分支只有最新快照、不累积历史。
          git checkout --orphan data-snapshot
          if git rev-parse --verify origin/data >/dev/null 2>&1; then
            git read-tree origin/data
          else
            git read-tree --empty
          fi
          mkdir -p data
          cp "$RUNNER_TEMP/models.json" data/models.json
          git add -f data/models.json
          git commit -q -m "chore(data): 同步 models.dev 完整元数据"
          git push -f origin HEAD:data