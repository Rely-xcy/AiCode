name: CI

# push 到 main / fork/release 或对应 PR 时触发：构建 universal debug（单 flavor 冒烟）+ 跑单元测试。
# 目的是合入前的兜底门禁，避免编译错误/回归推迟到打 tag 发版当天才暴露。
# 打 v* tag 的发版构建走 android-release.yml，不在这里。
on:
  push:
    # main 保持对上游干净需要它守；fork/release 出包（Beta）前也需要它守。
    branches: [ main, fork/release ]
    # 纯文档/资源改动不影响构建产物，跳过 CI 省时间（public 仓库虽不扣额度，但省 11 分钟等待）。
    # 注意：只要本次 push 含任一非忽略路径的改动，CI 仍会触发。
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'docs-site/**'
      - 'LICENSE'
      - '.gitignore'
  # 允许 API/页面手动触发（复验 flake、重跑门禁用）。
  workflow_dispatch:
  pull_request:
    branches: [ main, fork/release ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'docs-site/**'
      - 'LICENSE'
      - '.gitignore'

# 同分支新提交到来时取消正在跑的旧 run，省 CI 额度。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # versionCode 由 build.gradle.kts 的 gitCommitCount() 在配置阶段取
          # git rev-list --count HEAD，浅克隆（默认 depth=1）会得到 1，必须拉完整历史。
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # PR 用只读缓存，仅 main 的 push 写回缓存，避免被 PR 污染。
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      # 迁移版本号对账：编号连续、SCHEMA_VERSION 一致、已发布迁移未被篡改/复用
      # （hotfix 合流后 main 未把未发布迁移后移会在这里被拦）。
      - name: Check migration versions
        run: python3 scripts/check_migrations.py

      # 单 flavor 冒烟：只构 universal debug（CLAUDE.md 规范：AI 改完编译型代码默认跑这个），
      # 不构全量三 flavor，省三倍 Kotlin 编译。
      - name: Build universal debug (smoke)
        run: ./gradlew :app:assembleUniversalDebug --stacktrace

      # 单元测试（app/src/test 下的 Kotlin 单测）。
      # 只跑 universal debug 变体：单测逻辑与 flavor 无关（flavor 仅影响 abiFilters/assets），
      # 跑全 flavor 6 变体是重复编译，无额外覆盖。
      - name: Run unit tests
        run: ./gradlew :app:testUniversalDebugUnitTest

      # Room 的 schema 导出（app/schemas/<Version>.json）由 KSP 在构建时生成，是 MigrationTest
      # 的输入。没有 JDK 的开发环境（例如容器里的 agent）生成不了它，只能从构建产物里取。
      # always()：即使上面的构建/测试失败也要传，缺 schema 正是测试红的原因之一。
      - name: Upload generated Room schemas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: room-schemas
          path: app/schemas
          if-no-files-found: warn
          retention-days: 14

      # 诊断：app/schemas 里只有历史版本、缺当前版本时，用它定位 KSP 到底把文件写到哪了。
      - name: Locate generated Room schemas
        if: always()
        run: |
          echo "--- app/schemas ---"
          ls -la app/schemas/*/ || true
          echo "--- 全仓库找当前版本 schema ---"
          find . -name "*.json" -path "*schemas*" -not -path "./.git/*" || true
